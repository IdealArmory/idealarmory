name: Build Search Index

on:
  # Rebuild after any feed refresh completes
  workflow_run:
    workflows:
      - "Refresh EuroOptic Catalog"
      - "Refresh Bereli Catalog"
      - "Refresh Impact Guns Catalog"
      - "Refresh CYA Supply Co. Catalog"
      - "Refresh Lucky Gunner Catalog"
      - "Refresh Guns.com Catalog"
    types: [completed]
  # Allow manual rebuild from the Actions tab
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Pull latest so we get updated feed files from the triggering workflow
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build search index
        run: node .github/scripts/build-search-index.js

      - name: Build deal-of-the-day pool
        run: node .github/scripts/build-deals.js

      - name: Build best-sellers pool
        run: node .github/scripts/build-best-sellers.js

      - name: Update sitemap with lastmod dates and best-seller product URLs
        run: node .github/scripts/build-sitemap.js

      - name: Commit and push updated index
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add data/search-index.json data/deal-of-the-day.json data/best-sellers.json sitemap.xml
          git diff --staged --quiet || git commit -m "Auto-rebuild search index + deal-of-the-day + best-sellers [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git pull --rebase origin main
          git push origin main

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
